server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/reagent_db
    username: reagent
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

device:
  token: ${DEVICE_TOKEN:demo-token}

management:
  endpoints:
    web:
      exposure:
        include: health
